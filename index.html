<style>
/* Tablet photo-album: home = sections of client folders, tap a folder to open it, tap a photo for a full-screen swipe viewer. Lime only as a hairline accent (brand: green <= 5%). */
:root { --bg:#09090b; --panel:#141417; --line:#26262b; --fg:#f4f4f5; --muted:#a1a1aa; --lime:#98ed06; --font:"Inter",system-ui,-apple-system,Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; scroll-padding-top:120px; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); -webkit-font-smoothing:antialiased; }
body { padding:0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible { outline:2px solid var(--lime); outline-offset:3px; }
.wrap { max-width:1280px; margin:0 auto; padding:0 max(16px, 3vw); }

/* top bar */
.bar { position:sticky; top:0; z-index:10; background:rgba(9,9,11,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0); }
.bar .row { height:62px; display:flex; align-items:center; gap:14px; }
.bar img { height:20px; }
.back { display:none; align-items:center; gap:8px; font-weight:700; font-size:16px; padding:10px 14px 10px 8px; border-radius:999px; background:var(--panel); border:1px solid var(--line); }
.back svg { width:18px; height:18px; }
body.in-album .back { display:inline-flex; }
body.in-album .bar img, body.in-album .chips { display:none; }
.sp { flex:1; }
.lang { display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.lang button { color:var(--muted); font-weight:700; font-size:13px; padding:9px 15px; }
.lang button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chips a { flex:none; color:var(--fg); text-decoration:none; font-size:14px; font-weight:600; padding:8px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--line); }

/* home */
.head { padding:34px 0 8px; }
.eyebrow { font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:10px; }
.eyebrow::before { content:""; width:22px; height:2px; background:var(--lime); }
h1 { font-size:clamp(34px,5vw,56px); font-weight:900; letter-spacing:-.03em; line-height:1; margin:12px 0 0; }
.sec h2 { font-size:clamp(24px,3vw,32px); font-weight:800; letter-spacing:-.02em; margin:44px 0 18px; display:flex; align-items:baseline; gap:12px; }
.sec h2 span { font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0; }
.folders { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px 16px; }
@media (max-width:900px) { .folders { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.folder { text-align:left; display:block; min-width:0; }
.folder .cv { position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:var(--panel); box-shadow:0 -6px 0 -2px #1d1d21, 0 10px 30px rgba(0,0,0,.45); }
.folder img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
.folder:active img { transform:scale(.98); }
.folder .nm { font-size:18px; font-weight:800; margin-top:11px; letter-spacing:-.01em; }
.folder .mt { font-size:14px; color:var(--muted); margin-top:2px; }
.badge { position:absolute; right:10px; bottom:10px; background:rgba(9,9,11,.78); font-size:12px; font-weight:700; padding:5px 9px; border-radius:7px; }

/* album */
.album { display:none; padding-bottom:40px; }
body.in-album .home { display:none; }
body.in-album .album { display:block; }
.hero { position:relative; margin-top:20px; border-radius:16px; overflow:hidden; aspect-ratio:3/2; max-height:64vh; width:100%; background:var(--panel); display:block; }
.hero img { width:100%; height:100%; object-fit:cover; display:block; }
.hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(9,9,11,.85)); }
.hero .t { position:absolute; left:22px; right:22px; bottom:18px; z-index:1; text-align:left; }
.hero h2 { margin:0; font-size:clamp(30px,4.6vw,48px); font-weight:900; letter-spacing:-.03em; }
.hero p { margin:4px 0 0; color:#d4d4d8; font-size:16px; font-weight:500; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px; }
@media (max-width:700px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.grid button { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:var(--panel); }
.grid img { width:100%; height:100%; object-fit:cover; display:block; }
.play { position:absolute; inset:0; display:grid; place-items:center; }
.play span { width:54px; height:54px; border-radius:50%; background:rgba(9,9,11,.6); display:grid; place-items:center; border:2px solid rgba(255,255,255,.85); }
.play svg { width:20px; height:20px; margin-left:3px; }
.tag { position:absolute; left:8px; top:8px; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; background:rgba(9,9,11,.78); padding:4px 7px; border-radius:6px; }

.foot { border-top:1px solid var(--line); margin-top:48px; padding:20px 0 28px; color:var(--muted); font-size:15px; display:flex; flex-wrap:wrap; gap:8px 26px; }
.foot b { color:var(--fg); }

/* viewer */
.vw { position:fixed; inset:0; z-index:50; background:#000; display:flex; align-items:center; justify-content:center; touch-action:pan-y; }
.vw[hidden] { display:none; }
#vw-m { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.vw img, .vw video { max-width:100%; max-height:100%; object-fit:contain; display:block; }
.vw .c { position:absolute; top:calc(18px + env(safe-area-inset-top,0px)); left:80px; right:80px; text-align:center; font-weight:700; font-size:15px; color:#d4d4d8; pointer-events:none; }
.vw .ctl { position:absolute; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.14); display:grid; place-items:center; }
.vw .ctl svg { width:24px; height:24px; }
.vw .x { top:calc(12px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); }
.vw .p { left:calc(12px + env(safe-area-inset-left,0px)); top:50%; transform:translateY(-50%); }
.vw .n { right:calc(12px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); }
</style>

<header class="bar"><div class="wrap">
  <div class="row">
    <button class="back" id="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-en="All work" data-es="Todos">All work</span></button>
    <img src="fotos/logo.svg" alt="Kauza Wraps">
    <div class="sp"></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="b-en" aria-pressed="true">EN</button><button type="button" id="b-es" aria-pressed="false">ES</button></div>
  </div>
  <nav class="chips" id="chips"></nav>
</div></header>

<main class="wrap">
  <section class="home">
    <div class="head">
      <div class="eyebrow" data-en="Portfolio · Buford, GA" data-es="Portafolio · Buford, GA">Portfolio · Buford, GA</div>
      <h1 data-en="Our work" data-es="Nuestro trabajo">Our work</h1>
    </div>
    <div id="secs"></div>
  </section>
  <section class="album" id="album"></section>
  <div class="foot"><span><b>404-381-1222</b></span><span>@kauzawraps</span><span data-en="Design · Print · Install" data-es="Diseño · Impresión · Instalación">Design · Print · Install</span></div>
</main>

<div class="vw" id="vw" hidden role="dialog" aria-modal="true" aria-label="Viewer">
  <div id="vw-m"></div>
  <div class="c" id="vw-c"></div>
  <button type="button" class="ctl x" id="vw-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" class="ctl p" id="vw-p" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button type="button" class="ctl n" id="vw-n" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<script src="album2/data.js"></script>
<script>
// DATA (album2/data.js, written by build/build.py): [{id, name:[en,es], albums:[{id, name, sub:[en,es], items:[{s, t?} | {v, p}]}]}]
const SECS = window.DATA || [];
const ALL = SECS.flatMap(s => s.albums.map(a => ({ ...a, sec: s })));
let L = "en";
const tr = p => p[L === "en" ? 0 : 1];
const TAG = { ret: ["Retouched", "Retocada"], before: ["Before", "Antes"], after: ["After", "Después"] };
const PLAY = '<div class="play"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg></span></div>';
const thumb = it => it.v ? it.p : it.s;
const cover = a => thumb(a.c != null ? a.items[a.c] : a.items.find(i => i.s && !i.t) || a.items.find(i => i.s && i.t !== "before") || a.items[0]);

function renderHome() {
  document.getElementById("chips").innerHTML = SECS.map(s => `<a href="#s-${s.id}">${tr(s.name)}</a>`).join("");
  document.getElementById("secs").innerHTML = SECS.map(s => `<div class="sec" id="s-${s.id}"><h2>${tr(s.name)}<span>${s.albums.length}</span></h2><div class="folders">${s.albums.map(a => {
    const n = a.items.filter(i => i.s).length, v = a.items.length - n;
    const cnt = `${n} ${L === "en" ? "photo" : "foto"}${n === 1 ? "" : "s"}${v ? ` · ${v} video${v > 1 ? "s" : ""}` : ""}`;
    return `<button class="folder" type="button" data-id="${a.id}"><div class="cv"><img src="${cover(a)}" alt="${a.name}" loading="lazy"><span class="badge">${cnt}</span></div><div class="nm">${a.name}</div><div class="mt">${tr(a.sub)}</div></button>`;
  }).join("")}</div></div>`).join("");
  document.querySelectorAll(".folder").forEach(b => b.onclick = () => { location.hash = "a-" + b.dataset.id; });
}
let cur = null, list = [], idx = 0;
function renderAlbum(a) {
  cur = a; list = a.items;
  const c = cover(a);
  document.getElementById("album").innerHTML =
    `<button class="hero" type="button" data-i="${list.findIndex(i => thumb(i) === c)}"><img src="${c}" alt="${a.name}"><div class="t"><h2>${a.name}</h2><p>${tr(a.sec.name)} · ${tr(a.sub)}</p></div></button>
     <div class="grid">${list.map((it, i) => `<button type="button" data-i="${i}"><img src="${thumb(it)}" alt="${a.name} ${i + 1}" loading="lazy">${it.v ? PLAY : ""}${it.t ? `<span class="tag">${tr(TAG[it.t])}</span>` : ""}</button>`).join("")}</div>`;
  document.querySelectorAll("#album [data-i]").forEach(b => b.onclick = () => openV(+b.dataset.i));
}
let homeY = 0;
function route() {
  const h = location.hash;
  const a = h.startsWith("#a-") ? ALL.find(x => x.id === h.slice(3)) : null;
  const was = document.body.classList.contains("in-album");
  if (a && !was) homeY = window.scrollY;
  document.body.classList.toggle("in-album", !!a);
  closeV();
  if (a) { renderAlbum(a); window.scrollTo(0, 0); }
  else if (was) window.scrollTo(0, homeY);
}
// full-screen viewer with swipe
const vw = document.getElementById("vw"), vm = document.getElementById("vw-m"), vc = document.getElementById("vw-c");
function openV(i) {
  idx = (i + list.length) % list.length; const it = list[idx];
  vm.innerHTML = it.v ? `<video src="${it.v}" poster="${it.p}" autoplay muted loop playsinline controls></video>` : `<img src="${it.s}" alt="${cur.name}">`;
  vc.textContent = `${cur.name} · ${idx + 1} / ${list.length}`;
  vw.hidden = false;
}
function closeV() { vw.hidden = true; vm.innerHTML = ""; }
document.getElementById("vw-x").onclick = closeV;
document.getElementById("vw-p").onclick = () => openV(idx - 1);
document.getElementById("vw-n").onclick = () => openV(idx + 1);
document.addEventListener("keydown", e => { if (vw.hidden) return; if (e.key === "Escape") closeV(); if (e.key === "ArrowLeft") openV(idx - 1); if (e.key === "ArrowRight") openV(idx + 1); });
let sx = null;
vw.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive:true });
vw.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) openV(idx + (dx < 0 ? 1 : -1)); sx = null; });
document.getElementById("back").onclick = () => { location.hash = ""; };
// language (ES remembered per tablet)
function setLang(l) {
  L = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-en]").forEach(el => { el.textContent = el.getAttribute("data-" + l); });
  document.getElementById("b-en").setAttribute("aria-pressed", l === "en");
  document.getElementById("b-es").setAttribute("aria-pressed", l === "es");
  try { localStorage.setItem("kw-lang", l); } catch (e) {}
  renderHome(); if (cur && document.body.classList.contains("in-album")) renderAlbum(cur);
}
document.getElementById("b-en").onclick = () => setLang("en");
document.getElementById("b-es").onclick = () => setLang("es");
window.addEventListener("hashchange", route);
let saved = "en"; try { saved = localStorage.getItem("kw-lang") || "en"; } catch (e) {}
setLang(saved); route();
</script>

<div id="kw-off" style="position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:#141417;border:1px solid #26262b;color:#f4f4f5;font:500 13px Inter,system-ui,sans-serif;padding:8px 14px;border-radius:999px" hidden></div>
<script>
if ("serviceWorker" in navigator) {
  const pill = document.getElementById("kw-off");
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data.type === "progress") { pill.hidden = false; pill.textContent = "Saving for offline use " + Math.round(100 * e.data.done / e.data.total) + "%"; }
    if (e.data.type === "ready") { pill.hidden = false; pill.textContent = "Ready to use offline"; setTimeout(() => pill.hidden = true, 3000); }
  });
  navigator.serviceWorker.register("sw.js");
}
</script>
